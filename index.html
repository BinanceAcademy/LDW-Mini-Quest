<title>Binance Academy Mini Quest — Laos Digital Week</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0e11;--card:#1e2329;--line:#3a3f47;--y:#fcd535;--t:#fff;--m:#b7bdc6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--t);font-family:"Noto Sans Lao","Lao Sangam MN","Leelawadee UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 100%,rgba(252,213,53,.75),transparent 60%),linear-gradient(180deg,#0b0e11 0%,#181a20 55%,#3b3209 100%)}
.card{background:rgba(30,35,41,.94);border:1px solid var(--line);border-radius:22px;padding:18px}
.btn{display:block;width:100%;text-align:center;background:var(--y);color:#181a20;font-weight:900;border-radius:16px;padding:16px;font-size:16px;border:0;cursor:pointer;box-shadow:0 6px 24px rgba(252,213,53,.3);transition:transform .1s}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--y);border:2px solid var(--y);box-shadow:none}.btn:disabled{opacity:.35;box-shadow:none}
.opt{display:block;width:100%;text-align:left;background:#0b0e11;border:2px solid var(--line);border-radius:14px;padding:14px;color:var(--t);font-size:15px;margin-top:8px}
.opt:active{border-color:var(--y)}
.ck{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#0b0e11;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:14px;color:var(--t);margin-top:12px}
.ck i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--y);display:flex;align-items:center;justify-content:center;color:#181a20;font-style:normal;font-weight:900}.ck.on i{background:var(--y)}.ck.on{border-color:var(--y)}
.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.cf{position:fixed;top:-20px;z-index:50;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pc{transition:all .12s;border:2px solid var(--line);border-radius:22px;background:var(--card);padding:16px 8px;text-align:center}.pc.hi{background:var(--y);color:#181a20;border-color:var(--y);transform:scale(1.07);box-shadow:0 0 28px rgba(252,213,53,.7)}.pc.win{animation:pulse .6s ease 3}.pc.out{opacity:.35}@keyframes pulse{50%{transform:scale(1.15)}}
.hero{background:radial-gradient(circle at 50% 0,rgba(252,213,53,.25),transparent 65%)}.fl{position:absolute;font-size:30px;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-14px) rotate(10deg)}}
.glow{border-color:var(--y);box-shadow:0 0 26px rgba(252,213,53,.35);animation:gl 2s ease-in-out infinite}@keyframes gl{50%{box-shadow:0 0 40px rgba(252,213,53,.6)}}
.rw{background:linear-gradient(135deg,#fcd535,#f0b90b);color:#181a20;border-radius:22px;padding:20px;text-align:center}
.bulbs{border:3px dotted var(--y);border-radius:28px;padding:10px;margin:18px 0;box-shadow:0 0 30px rgba(252,213,53,.35),inset 0 0 20px rgba(252,213,53,.15);animation:bl .9s steps(2) infinite}@keyframes bl{50%{border-color:#fff}}.jp{display:inline-block;background:linear-gradient(90deg,#f0b90b,#fcd535,#f0b90b);color:#181a20;font-weight:900;font-size:12px;border-radius:99px;padding:4px 14px;animation:gl 1.5s infinite}.bob{animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 22px rgba(252,213,53,.55))}@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}.err{color:#f6465d;font-size:13px}
</style></head>

/* ============ STATE (prototype: browser only) ============ */
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rnd=n=>Array.from({length:n},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
const fresh=()=>({pid:"BAQ-"+rnd(6),view:"hero",m:{},lk:{},ck:0,qi:0,ans:[],easy:null,draw:null});
let S=ls.get("baq2_session",null)||fresh();const save=()=>ls.set("baq2_session",S);
const inv=()=>{let i=ls.get("baq2_inv",null);if(!i){i={};CONFIG.prizes.forEach(p=>i[p.id]={rem:p.qty});ls.set("baq2_inv",i)}return i};
const prize=id=>CONFIG.prizes.find(p=>p.id===id);
function record(code,pid,status){const D=ls.get("baq2_draws",[]);D.push({code,pid:S.pid,prize_id:pid,status});ls.set("baq2_draws",D)}
function unlockEasy(){if(S.easy)return;const I=inv(),id=CONFIG.easyPrizeId;let ok=I[id].rem>0;if(ok){I[id].rem--;ls.set("baq2_inv",I)}
 S.easy={code:CONFIG.codePrefix+rnd(6),prize_id:ok?id:null};record(S.easy.code,S.easy.prize_id,ok?"RESERVED":"NEEDS_STAFF");save()}
/* Premium draw. NOTE: production must run this server-side (atomic). Here = local demo, so staff must confirm. */
async function drawPrize(){if(S.draw)return S.draw;
 const I=inv(),pool=CONFIG.prizes.filter(p=>p.premium&&I[p.id].rem>0),tot=pool.reduce((s,p)=>s+I[p.id].rem,0);let id=null;
 if(tot){let x=Math.random()*tot;id=pool[pool.length-1].id;for(const p of pool){x-=I[p.id].rem;if(x<0){id=p.id;break}}I[id].rem--;ls.set("baq2_inv",I)}
 S.draw={code:CONFIG.codePrefix+rnd(6),prize_id:id,confirmed:false};record(S.draw.code,id,id?"RESERVED":"NEEDS_STAFF");save();return S.draw}

const $=s=>document.querySelector(s),app=$("#app");
const done=()=>["info","comm","photo","read","quiz"].filter(k=>S.m[k]).length;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function confetti(n=45){const c=["#fcd535","#fff","#0ecb81","#f6465d"];for(let i=0;i<n;i++){const d=document.createElement("i");d.className="cf";d.style.cssText=`left:${Math.random()*100}vw;background:${c[i%4]};width:9px;height:14px;border-radius:${i%3?2:7}px;animation-duration:${2+Math.random()*2.2}s;animation-delay:${Math.random()*.8}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}}
const bar=()=>`<div class="mb-4 pt-2"><div class="flex justify-between text-sm font-bold"><span>ຄວາມຄືບໜ້າ</span><span class="text-[#fcd535]">ສຳເລັດແລ້ວ ${done()} / 5 ພາລະກິດ</span></div><div class="h-3 rounded-full mt-2" style="background:#0b0e11;border:1px solid var(--line)"><div class="h-full rounded-full" style="background:linear-gradient(90deg,#f0b90b,#fcd535);width:${done()*20}%;transition:width .7s cubic-bezier(.2,1,.3,1);box-shadow:0 0 12px #fcd535"></div></div></div>`;
const tag=(t)=>`<div class="text-xs font-black text-[#fcd535] tracking-wider">${t}</div>`;
const chk=(t,on,en=true)=>en?`<button class="ck ${on?'on':''}" data-act="ck"><i>${on?'✓':''}</i><span>${t}</span></button>`:"";
const go=v=>{S.view=v;S.ck=0;S.qi=0;S.ans=[];save();render();scrollTo(0,0)};

<div class="grid grid-cols-3 gap-2 mt-3 text-center"><div class="card !p-3"><div class="text-xs">TOTAL</div><b class="text-xl">${tot}</b></div><div class="card !p-3"><div class="text-xs">REMAINING</div><b class="text-xl">${rem}</b></div><div class="card !p-3"><div class="text-xs">CLAIMED</div><b class="text-xl">${D.filter(d=>d.status==="CLAIMED").length}</b></div></div>
<div class="card mt-3"><h2 class="font-extrabold">Verify claim code</h2><input id="cc" placeholder="BA-LDW-XXXXXX" class="w-full rounded-xl p-3 mt-2 text-black uppercase"><button class="btn mt-3" data-act="verify">VERIFY</button>
${r===0?`<div class="err mt-2">Code not found on this device.</div>`:r?`<div class="mt-3 text-sm">Quest ID: <b>${r.pid}</b><br>Prize: <b>${r.prize_id?prize(r.prize_id).name:"Needs staff decision"}</b><br>Status: <b>${r.status==="CLAIMED"?"✓ PRIZE CLAIMED":"UNCLAIMED"}</b></div>${r.status==="CLAIMED"?"":`<button class="btn mt-3" data-act="claim" data-c="${r.code}">MARK AS CLAIMED</button>`}`:""}</div>
<div class="card mt-3"><h2 class="font-extrabold mb-2">Inventory</h2>${CONFIG.prizes.map(p=>`<div class="flex justify-between items-center py-2 border-b" style="border-color:var(--line)"><div>${p.emoji} ${p.name}<div class="text-xs" style="color:var(--m)">${p.qty} total${p.premium?"":" · starter reward"}</div></div><div class="text-right"><b class="${I[p.id].rem?'':'text-[#f6465d]'}">${I[p.id].rem?I[p.id].rem+" remaining":"ໝົດແລ້ວ"}</b><div class="flex gap-1 mt-1 justify-end"><button class="px-3 rounded" style="background:var(--line)" data-act="adj" data-p="${p.id}" data-d="-1">−</button><button class="px-3 rounded" style="background:var(--line)" data-act="adj" data-p="${p.id}" data-d="1">+</button></div></div></div>`).join("")}</div><a class="block text-center text-sm mt-4 underline" href="#/">← Participant page</a>`}
function render(){if(location.hash.startsWith("#/staff")){app.innerHTML=vStaff();return}app.innerHTML=(V[S.view]||V.hero)()+`<p class="text-center text-[10px] mt-6" style="color:var(--m)">${CONFIG.eventName} · Binance Academy</p>`}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,d=t.dataset;
 if(a==="lk"){S.lk[d.k]=1;save();setTimeout(render,400);return}
 if(a==="go")return go(d.v);
 if(a==="ck"){S.ck=S.ck?0:1;save();render()}
 if(a==="info"){S.m.info=1;confetti(30);go("m1")}
 if(a==="m"){S.m[d.k]=1;confetti(40);go(d.next)}
 if(a==="copy"){const h=CONFIG.hashtag,ok=()=>{t.textContent="ກ໊ອບປີ້ແລ້ວ ✓";confetti(15)};try{navigator.clipboard.writeText(h).then(ok,()=>{})}catch(x){const i=document.createElement("input");i.value=h;document.body.appendChild(i);i.select();try{document.execCommand("copy");ok()}catch(y){}i.remove()}}
 if(a==="ans"){S.ans[S.qi]=+d.i;S.qi++;save();render()}
 if(a==="retry"){S.qi=0;S.ans=[];save();render()}
 if(a==="pass"){S.m.quiz=1;S.m.score=+d.sc;confetti(80);go("prem")}
 if(a==="pick"){t.disabled=true;t.textContent="ກຳລັງໝຸນ…";const P=CONFIG.prizes.filter(p=>p.premium),cards=P.map((_,k)=>$("#pc"+k));let hi=-1,n=0,delay=70;const res=drawPrize();const lit=k=>cards.forEach((c,j)=>c.classList.toggle("hi",j===k));
  const H=["ຮູ້ສຶກໂຊກດີບໍ? 🍀","Binancian ຖືກລາງວັນໃຫຍ່! 🚀","ໃກ້ແລ້ວ… 👀","ລໍຖ້າແດ່! ✨"];const tick=async()=>{do{hi=(hi+1)%P.length}while(cards[hi].classList.contains("out")&&n<60);lit(hi);n++;if(n%6===1)$("#dmsg").textContent=H[(n/6|0)%4];delay*=1.08;if(n<20||delay<380){setTimeout(tick,delay);return}
   const r=await res;$("#dmsg").textContent="ກຳລັງລັອກຜົນ…";const w=r.prize_id?P.findIndex(p=>p.id===r.prize_id):-1;
   (function land(){if(w<0){lit(-1);setTimeout(()=>go("win"),600);return}hi=(hi+1)%P.length;lit(hi);if(hi!==w){delay*=1.15;setTimeout(land,delay);return}cards[w].classList.add("win");confetti(70);setTimeout(()=>go("win"),1700)})()};(async()=>{for(const x of ["3…","2…","1…","ໄປ! 🚀"]){$("#dmsg").textContent=x;await new Promise(r=>setTimeout(r,550))}tick()})()}
 if(a==="staffhelp")$("#sh").classList.toggle("hidden");
 if(a==="newq"){S=fresh();save();render();scrollTo(0,0)}
 if(a==="pin"){if($("#pin").value===CONFIG.staffPin){sAuth=true;sMsg=""}else sMsg="Wrong PIN";render()}
 if(a==="verify"){const c=$("#cc").value.trim().toUpperCase();sRes=ls.get("baq2_draws",[]).find(x=>x.code===c)||0;render()}
 if(a==="claim"){const D=ls.get("baq2_draws",[]),x=D.find(y=>y.code===d.c);if(x&&x.status!=="CLAIMED"){x.status="CLAIMED";ls.set("baq2_draws",D);sRes=x}render()}
 if(a==="adj"){const I=inv(),p=prize(d.p);I[p.id].rem=Math.max(0,Math.min(p.qty,I[p.id].rem+ +d.d));ls.set("baq2_inv",I);render()}
});
addEventListener("hashchange",render);render();
</script></body></html>
